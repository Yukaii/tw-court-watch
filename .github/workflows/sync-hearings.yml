name: Sync Court Hearings

on:
  schedule:
    # 06:30 & 18:30 Asia/Taipei (UTC+8) = 22:30 & 10:30 UTC
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days ahead to sync"
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: sync-hearings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Taiwan major courts hearings
        run: bun scripts/sync-hearings.ts --days=${{ inputs.days || '14' }} --delay=1200

      - name: Commit and push updated static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hearings
          if git diff --cached --quiet; then
            echo "No hearing schedule changes."
            exit 0
          fi
          git commit -m "chore(data): sync court hearings ($(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M))"
          git push
